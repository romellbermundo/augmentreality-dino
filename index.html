<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b19"><meta name="description" content="Place a giant T-Rex in your world using augmented reality.">
<title>T-Rex AR • Dinosaur Encounter</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f6ef;background:#101b19}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}canvas{display:block}
#stage{position:fixed;inset:0}#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));z-index:2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}header div{background:#10231fcb;border:1px solid #ffffff28;border-radius:18px;padding:11px 16px;backdrop-filter:blur(12px)}h1{font-size:1.13rem;letter-spacing:.04em;margin:0}header p{margin:4px 0 0;color:#c6d5c8;font-size:.75rem}#status{align-self:center;text-align:center;background:#10231fd9;border:1px solid #ffffff24;border-radius:14px;padding:9px 14px;font-size:.84rem;max-width:min(440px,95%);backdrop-filter:blur(12px)}
#controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;pointer-events:auto}button{cursor:pointer;border:1px solid #ffffff40;background:linear-gradient(180deg,#3b6858,#254638);color:white;border-radius:13px;padding:12px 15px;font-weight:700;box-shadow:0 5px 18px #0005}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:3px solid #d5e8a8;outline-offset:2px}.secondary{background:linear-gradient(180deg,#253c37,#152722)}#ar-slot{pointer-events:auto;display:flex;justify-content:center}#ar-slot button{position:static!important;width:auto!important;height:auto!important;line-height:normal!important;font-size:.94rem!important;opacity:1!important;display:inline-block!important}
#help{pointer-events:none;text-align:center;font-size:.74rem;color:#d0dcd2;text-shadow:0 2px 8px #000;margin:7px auto 0;max-width:440px}#reticle-tip{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:.75rem;color:#fff9;pointer-events:none;display:none}
body.ar-active #status{display:block}body.ar-active #reticle-tip{display:block}body.ar-active #help{display:none}body.ar-active #place{display:inline-block}#place{display:none;background:linear-gradient(180deg,#d7e98c,#8aaf47);color:#13251a;border:2px solid #ecffc2;font-size:1rem}body.ar-active #controls{background:#10231f9c;border-radius:18px;padding:9px}body.ar-active #reticle-tip{top:40%;background:#10231fbb;border-radius:12px;padding:9px 12px;text-align:center;width:max-content;max-width:85vw}body.ar-active #ar-slot{display:none}
@media(max-width:460px){#controls{gap:7px}button{padding:11px;font-size:.83rem}header div{padding:10px 12px}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui">
<header><div><h1>🦖 T-REX ENCOUNTER</h1><p>Bring the prehistoric world to life</p></div></header>
<div id="status" role="status">Loading your dinosaur…</div>
<div><div id="controls"><div id="ar-slot"></div><button id="place" type="button">🦖 Place T-Rex</button><button class="secondary" id="size" type="button">Size: Life-sized</button><button class="secondary" id="rotate" type="button">Rotate ↻</button><button class="secondary" id="reset" type="button">Reset</button></div><p id="help">Drag to rotate • Pinch to zoom • In AR, scan the ground and tap to place</p></div>
</div>
<div id="reticle-tip">Move your phone slowly to scan the ground, then press Place T-Rex</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
import {OBJLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/OBJLoader.js';
import {MTLLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/loaders/MTLLoader.js';
import {ARButton} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/webxr/ARButton.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#162521');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,150);camera.position.set(7,4.3,10);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf6ff,0x475345,2.2));const sun=new THREE.DirectionalLight(0xffe6ba,3);sun.position.set(5,11,7);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,80),new THREE.MeshStandardMaterial({color:0x2a4235,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const grid=new THREE.GridHelper(30,30,0x65816b,0x385447);grid.position.y=-.02;scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.8,0);controls.enableDamping=true;controls.maxDistance=35;controls.minDistance=3;controls.maxPolarAngle=Math.PI*.49;controls.update();
const dinosaur=new THREE.Group();scene.add(dinosaur);
let loaded=false,mini=false,placed=false;const BASE_HEIGHT=4.1;
function applySize(){dinosaur.scale.setScalar(mini?.16:1);document.getElementById('size').textContent=mini?'Size: Mini':'Size: Life-sized'}
const materialLoader=new MTLLoader();materialLoader.setPath('./assets/psone/');materialLoader.load('t-rexaur.mtl',materials=>{
 materials.preload();const loader=new OBJLoader();loader.setMaterials(materials);loader.load('./assets/psone/t-rexaur.obj',model=>{
  // The original game asset uses a large, arbitrary unit scale.
  // Normalize its height to approximately a real T-Rex's 4.1m.
  model.rotation.x=Math.PI; // Original PS1 asset was exported upside down.\n  model.updateMatrixWorld(true);\n  const box=new THREE.Box3().setFromObject(model),dims=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  if(!Number.isFinite(dims.y)||dims.y<=0)throw new Error('Invalid dinosaur geometry');
  model.position.sub(center);model.position.y+=dims.y/2;
  const normalized=new THREE.Group();normalized.add(model);normalized.scale.setScalar(BASE_HEIGHT/dims.y);
  dinosaur.add(normalized);loaded=true;applySize();status.textContent='Your T-Rex is ready! Explore in 3D or tap Start AR.';document.getElementById('size').disabled=false;
 },undefined,()=>status.textContent='The dinosaur model could not load. Please refresh.');
},undefined,()=>status.textContent='Dinosaur textures could not load. Please refresh.');
document.getElementById('size').disabled=true;
document.getElementById('size').onclick=()=>{mini=!mini;applySize()};
document.getElementById('rotate').onclick=()=>{dinosaur.rotation.y+=Math.PI/4};
document.getElementById('reset').onclick=()=>{dinosaur.rotation.set(0,0,0);dinosaur.position.set(0,0,0);placed=false;if(renderer.xr.isPresenting)dinosaur.visible=false;else{camera.position.set(7,4.3,10);controls.target.set(0,1.8,0);controls.update()}};
const reticle=new THREE.Mesh(new THREE.RingGeometry(.13,.18,40),new THREE.MeshBasicMaterial({color:0xb8e0ab,side:THREE.DoubleSide}));reticle.rotation.x=-Math.PI/2;reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
let hitTestSource=null,referenceSpace=null;const placeButton=document.getElementById('place');const tip=document.getElementById('reticle-tip');
const arButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.getElementById('ui')}});
document.getElementById('ar-slot').appendChild(arButton);
arButton.textContent=arButton.textContent==='START AR'?'Start AR':arButton.textContent;
renderer.xr.addEventListener('sessionstart',async()=>{
 document.body.classList.add('ar-active');tip.textContent='Scan the ground, then press Place T-Rex';placeButton.textContent='🦖 Place T-Rex';scene.background=null;ground.visible=false;grid.visible=false;controls.enabled=false;placed=false;dinosaur.visible=false;
 try{const session=renderer.xr.getSession();referenceSpace=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:referenceSpace});}catch(e){tip.textContent='Surface tracking unavailable. You can still place the T-Rex in front of you.'}
});
renderer.xr.addEventListener('sessionend',()=>{document.body.classList.remove('ar-active');scene.background=new THREE.Color('#162521');ground.visible=true;grid.visible=true;controls.enabled=true;dinosaur.visible=true;dinosaur.position.set(0,0,0);reticle.visible=false;hitTestSource?.cancel();hitTestSource=null;referenceSpace=null;placed=false});
function placeDinosaur(){
 if(!renderer.xr.isPresenting||!loaded){tip.textContent='The dinosaur is still loading. Please wait.';return}
 if(reticle.visible){dinosaur.position.setFromMatrixPosition(reticle.matrix)}
 else{
  // Simple fallback when the camera cannot identify a floor.
  const xrCamera=renderer.xr.getCamera();const direction=new THREE.Vector3(0,0,-1).applyQuaternion(xrCamera.quaternion);
  dinosaur.position.copy(xrCamera.position).addScaledVector(direction,3);
  dinosaur.position.y=Math.max(0,dinosaur.position.y-1.3);
 }
 dinosaur.rotation.y=0;dinosaur.visible=true;placed=true;tip.textContent='T-Rex placed! Move around to explore, or press Place again.';
}
placeButton.addEventListener('click',placeDinosaur);
renderer.domElement.addEventListener('click',()=>{if(renderer.xr.isPresenting)placeDinosaur()});
renderer.setAnimationLoop((time,frame)=>{
 if(renderer.xr.isPresenting&&frame&&hitTestSource){const hits=frame.getHitTestResults(hitTestSource);if(hits.length){const pose=hits[0].getPose(renderer.xr.getReferenceSpace());if(pose){reticle.visible=true;reticle.matrix.fromArray(pose.transform.matrix)}}else reticle.visible=false}
 if(!renderer.xr.isPresenting)controls.update();
 renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
