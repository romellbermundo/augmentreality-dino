<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello, World! - A-Frame</title>
    <meta name="description" content="Hello, World! - A-Frame" />
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@3.0.3/dist/aframe-event-set-component.min.js"></script>
  </head>
  <body>
    <a-scene loading-screen="dotsColor: red; backgroundColor: black">
      <a-assets>
        <!-- position: x z y -->
        <a-asset-items id="spaceship" src="assets/space_ship/spaceship.glb" />
        <a-asset-items id="rflogo" src="assets/rflogo/rflogo.glb" />
        <img
          id="skyTexture"
          src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/71eeef2d-6d2f-4799-a0d0-469308125783/d6h6gkp-590c6916-43b9-40ff-a650-35518b849ce2.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiJcL2ZcLzcxZWVlZjJkLTZkMmYtNDc5OS1hMGQwLTQ2OTMwODEyNTc4M1wvZDZoNmdrcC01OTBjNjkxNi00M2I5LTQwZmYtYTY1MC0zNTUxOGI4NDljZTIuanBnIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.IFVlxpzCKjJfKT5tXerSgTSddRxq8H81-SMIgkHZLU4"
        />
        <a-asset-items id="Flutter-obj" src="assets/psone/Flutter.obj" />
        <a-asset-items id="Flutter-mtl" src="assets/psone/Flutter.mtl" />
        <a-asset-items id="t-rexaur-obj" src="assets/psone/t-rexaur.obj" />
        <a-asset-items id="t-rexaur-mtl" src="assets/psone/t-rexaur.mtl" />
        <a-asset-items id="Naruto-obj" src="assets/pstwo/Naruto.obj" />
        <a-asset-items id="Naruto-mtl" src="assets/pstwo/Naruto.mtl" />
        <a-asset-items id="floor" src="assets/textures/wood-floor.jpg" />
        <a-asset-items
          id="Tibbers Hextech-obj"
          src="assets/games/Tibbers Hextech.obj"
        />
        <a-asset-items
          id="Tibbers Hextech-mtl"
          src="assets/games/Tibbers Hextech.mtl"
        />

        <img
          id="spheretexture"
          src="https://upload.wikimedia.org/wikipedia/commons/1/14/Patriarchate_of_Pe%C4%87_Monastery_Chipped_Paint_-quinn.anya.jpg"
        />
        <img
          id="boxtexture"
          src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Snake_Skin_Texture_%283%29.jpg"
        />
        <img
          id="cylindertexture"
          src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Snake_Skin_Texture_%283%29.jpg"
        />
        <img id="brickwalltexture" src="assets/textures/brick-wall.png" />
      </a-assets>

      <a-entity
        geometry="primitive: cylinder; heighht:2; radius:0.5; openEnded: true"
        position="2 0.75 -3"
        material="src:#cylindertexture; repeat: 2 1; side:double; color:#ffc65d"
        event-set__enter="_event: mouseenter; material.color: #4CC3D9"
        event-set__leave="_event: mouseleave; material.color::#ffc65d"
      ></a-entity>

      <a-torus
        id="rosca"
        rotation="0 0 0"
        position="-10 10 -20"
        color="#43A367"
        arc="360"
        radius="3"
        radius-tubular="0.2"
      ></a-torus>
      <a-sphere position="-10 10 -20" color="yellow" radius="2"></a-sphere>

      <a-sphere
        position="0 1.5 -6"
        radius="1.5"
        color="#EF2D5E"
        src="#spheretexture"
        event-set__enter="_event: mouseenter; color:#ffff99"
        event-set__leave="_event: mouseleave; color:#7a00cc"
      >
      </a-sphere>

      <a-entity
        id="box"
        geometry="primitive: box; width: 1; depth: 1; height: 1"
        position="-1.5 0.5 -2"
        rotation="0 45 0"
        material="src:#boxtexture; roughness: 2; metalness: 0; color: #4CC3D9"
        event-set__enter="_event: mouseenter; rotation:10 30 0"
        event-set__leave="_event: mouseleave; rotation:0 45 0"
      ></a-entity>
      <a-light
        type="ambient"
        position="0 0 0"
        rotation="0 0 0"
        target="#directionaltarget"
        intensity="1"
      ></a-light>
      <a-light type="point" position="10 0 -50"></a-light>
      <a-entity
        obj-model="obj: #Flutter-obj; mtl: #Flutter-mtl"
        scale=".01 .01 .01"
        position="0 10 -15"
        rotation="0 90 0"
      ></a-entity>
      <a-entity
        obj-model="obj: #Naruto-obj; mtl: #Naruto-mtl"
        position="3 0 -3"
        rotation="0 0 0"
      ></a-entity>
      <a-entity
        obj-model="obj: #t-rexaur-obj; mtl: #t-rexaur-mtl"
        scale=".001 .001 .001"
        position="0 0 -50"
        rotation="180 0 0"
      ></a-entity>
      <a-entity
        obj-model="obj: #Tibbers Hextech-obj; mtl: #Tibbers Hextech-mtl"
        scale=".1 .1 .1"
        position="15 0 -50"
        rotation="0 0 0"
      ></a-entity>

      <!-- workspace lights -->

      <a-box
        id="blue-box"
        position="9 0.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
      ></a-box>
      <a-box
        id="brick-box"
        position="9 2.5 -3"
        rotation="0 45 0"
        color="#4CC3D9"
        material="src:#brickwalltexture; roughness: 2; metalness: 0; color: #ffffff"
      ></a-box>
      <a-sphere position="10 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder
        position="11 0.75 -3"
        radius="0.5"
        height="1.5"
        color="#FFC65D"
      ></a-cylinder>
      <a-plane
        position="10 0 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
      ></a-plane>
      <a-sky src="#skyTexture" rotation="0 270 0"></a-sky>

      <!-- picnic blanket -->
      <a-plane
        position="0 .1 -4"
        rotation="-90 0 0"
        material="color: #FFFFFF; src: #floor; repeat: 5 5"
        scale="10 10 1"
      ></a-plane>
      <!-- <a-entity gltf-model="#spaceship" position="0 0 0"> </a-entity> -->
      <a-entity gltf-model="#rflogo" position="0 0 5"> </a-entity>
      <!-- <a-entity gltf-model="assets/rflogo/rflogo.glb" position="0 0 -10"> </a-entity> -->
      <a-entity
        gltf-model="assets/game-assets/WonderWalls_SecondAge.gltf"
        scale="3 3 3"
        position="10 0 -10"
      >
      </a-entity>
      <!-- <a-plane
      src="#groundTexture"
      rotation="-90 0 0"
      width="45"
      height="45"
    ></a-plane> -->

      <a-curvedimage
        src="#brickwalltexture"
        theta-length="90"
        theta-start="135"
        radius="0.707"
        position="-1 1.5 1"
        rotation="0 90 0"
      >
      </a-curvedimage>
      <a-camera>
        <a-cursor></a-cursor>
      </a-camera>
    </a-scene>

    <script>
      // Get the camera element
      const camera = document.querySelector("#camera");
      // Define the jump function
      function jump() {
        // Set the camera's y-position to a higher value
        camera.setAttribute(
          "position",
          `${camera.getAttribute("position").x} ${
            camera.getAttribute("position").y + 1
          } ${camera.getAttribute("position").z}`
        );
      }

      // Listen for the space keypress
      window.addEventListener("keydown", (event) => {
        if (event.code === "Space") {
          jump();
        }
      });
    </script>
    <script>
      let rx, ry, rz;
      rx = ry = rz = 0;
      let rot = rx + " " + ry + " " + rz;
      const rosquinha = document.getElementById("rosca");
      rosquinha.setAttribute("rotation", rot);
      const intervalo = setInterval(() => {
        ry++;
        rot = rx + " " + ry + " " + rz;
        rosquinha.setAttribute("rotation", rot);
      }, 20);
    </script>
  </body>
</html>
