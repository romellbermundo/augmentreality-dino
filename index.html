<body>
<div id="stage"></div>
<div id="ui">
<header><div><h1>🦖 T-REX ENCOUNTER</h1><p>A prehistoric world in your hands</p></div></header>

<div><div id="controls"><div id="ar-slot"></div><button id="place" type="button">Place Dino</button><button class="secondary" id="size" type="button">Mini</button><button class="secondary" id="rotate" type="button">↻ Rotate</button><button class="secondary" id="reset" type="button">Reset</button></div><p id="help">Drag to rotate • Pinch to zoom • In AR, scan the ground and tap to place</p></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const stage=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#162521');
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,150);camera.position.set(7,4.3,10);

scene.add(new THREE.HemisphereLight(0xd9e1d2,0x52584b,1.35));const sun=new THREE.DirectionalLight(0xffedcf,1.25);sun.position.set(5,11,7);scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(15,80),new THREE.MeshStandardMaterial({color:0x2a4235,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.03;scene.add(ground);
const grid=new THREE.GridHelper(30,30,0x65816b,0x385447);grid.position.y=-.02;scene.add(grid);

const idlePivot=new THREE.Group();dinosaur.add(idlePivot);
let loaded=false,mini=true,placed=false;const BASE_HEIGHT=4.1;

// Always provide a visible, lightweight dinosaur while the legacy OBJ loads.
function createFallbackRex(){
 const group=new THREE.Group();
 const skin=new THREE.MeshStandardMaterial({color:0x688b53,roughness:.85});
 const belly=new THREE.MeshStandardMaterial({color:0xa3a679,roughness:.9});
 const dark=new THREE.MeshStandardMaterial({color:0x283b25,roughness:.9});
 const ivory=new THREE.MeshStandardMaterial({color:0xece4c5,roughness:.6});
 function ellipsoid(parent,x,y,z,sx,sy,sz,material){const m=new THREE.Mesh(new THREE.SphereGeometry(1,18,12),material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);parent.add(m);return m}

 ellipsoid(group,0,2.1,0,1.5,.85,.7,skin);
 ellipsoid(group,.5,1.85,.02,.9,.53,.64,belly);
 segment(group,[.9,2.4,0],[1.65,3.15,0],.57,.43,skin);
 ellipsoid(group,2.05,3.37,0,.9,.49,.53,skin);
 ellipsoid(group,2.55,3.07,0,.73,.21,.45,skin);
 ellipsoid(group,2.55,2.95,0,.65,.1,.39,belly);
 for(const z of [-.44,.44]){ellipsoid(group,2.2,3.57,z,.095,.09,.06,dark);
  segment(group,[-.7,1.8,z*1.1],[-.85,.85,z*1.15],.36,.22,skin);
  segment(group,[-.85,.85,z*1.15],[-.7,.17,z*1.25],.23,.16,skin);
  ellipsoid(group,-.47,.16,z*1.25,.42,.15,.25,dark);
  segment(group,[1.1,2.4,z*.8],[1.58,1.9,z*.9],.19,.11,skin);
  segment(group,[1.58,1.9,z*.9],[1.95,1.91,z*.9],.1,.065,skin);
  for(let i=0;i<5;i++)segment(group,[2.12+i*.2,3.03,z*.88],[2.15+i*.2,2.87,z*.88],.055,.008,ivory);
 }
 let last=[-1.05,2.32,0];for(let i=0;i<7;i++){const next=[-1.55-i*.43,2.34+i*.075,0];segment(group,last,next,.55-i*.075,Math.max(.025,.47-i*.073),skin);last=next}

}
let legacyRigUpdate=null;
const fallback=createFallbackRex();idlePivot.add(fallback);let usingFallback=true;
function ready(message){loaded=true;applySize();status.textContent=message;document.getElementById('size').disabled=false}
ready('T-Rex ready! Explore in 3D or tap Start AR.');
const materialLoader=new MTLLoader();materialLoader.setPath('./assets/psone/');materialLoader.load('t-rexaur.mtl',materials=>{
 materials.preload();for(const material of Object.values(materials.materials)){if(material){material.shininess=8;material.specular?.setRGB(.045,.045,.045);material.needsUpdate=true}}const loader=new OBJLoader();loader.setMaterials(materials);loader.load('./assets/psone/t-rexaur.obj',model=>{
  // The original game asset uses a large, arbitrary unit scale.
  // Normalize its height to approximately a real T-Rex's 4.1m.
  model.rotation.x=Math.PI; // Correct original model orientation.
  model.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(model),dims=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  if(!Number.isFinite(dims.y)||dims.y<=0)throw new Error('Invalid dinosaur geometry');
  model.position.sub(center);model.position.y+=dims.y/2;
  // Lightweight procedural three-joint rig for this unrigged OBJ.
// Deform the head and tail regions around soft hinges; keep the torso stable.
const rigParts=[];
const axis='z', low=box.min[axis], high=box.max[axis], span=high-low;
const headEnd=low+span*.24, tailStart=low+span*.76;
const headHinge=low+span*.34, tailHinge=low+span*.66;
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
model.traverse(part=>{
 if(!part.isMesh||!part.geometry?.attributes?.position)return;
 // OBJLoader usually shares geometries only rarely; isolate them for safe deformation.

 const attr=part.geometry.attributes.position;
 const original=new Float32Array(attr.array);
 const weights=new Float32Array(attr.count*2);
 for(let i=0;i<attr.count;i++){
  const z=original[i*3+2];
  weights[i*2]=1-smooth((z-headEnd)/(headHinge-headEnd));
  weights[i*2+1]=smooth((z-tailHinge)/(tailStart-tailHinge));
 }
 rigParts.push({attr,original,weights,geometry:part.geometry});
});
const skeleton={head:{angle:0},tail:{angle:0},torso:{angle:0}};
let lastRigFrame=-1;
function updateLegacyRig(t){
 // Limit mesh updates to ~20fps to keep mobile AR responsive.
 if(t-lastRigFrame<.05)return;
 lastRigFrame=t;
 skeleton.head.angle=Math.sin(t*.85)*.085+Math.sin(t*.29)*.035;
 skeleton.tail.angle=Math.sin(t*1.2+.9)*.12;
 const headSin=Math.sin(skeleton.head.angle),headCos=Math.cos(skeleton.head.angle);
 const tailSin=Math.sin(skeleton.tail.angle),tailCos=Math.cos(skeleton.tail.angle);
 for(const p of rigParts){
  const out=p.attr.array,src=p.original,w=p.weights;
  for(let i=0;i<p.attr.count;i++){
   const j=i*3,x=src[j],y=src[j+1],z=src[j+2];
   const hw=w[i*2],tw=w[i*2+1];
   // Soft, weighted hinge rotations around the vertical (Y) axis.
   const hz=z-headHinge,tx=z-tailHinge;
   const headX=x*headCos-hz*headSin,headZ=headHinge+x*headSin+hz*headCos;
   const tailX=x*tailCos-tx*tailSin,tailZ=tailHinge+x*tailSin+tx*tailCos;
   out[j]=x+(headX-x)*hw+(tailX-x)*tw;
   out[j+1]=y;
   out[j+2]=z+(headZ-z)*hw+(tailZ-z)*tw;

}
const normalized=new THREE.Group();normalized.add(model);normalized.scale.setScalar(BASE_HEIGHT/dims.y);
legacyRigUpdate=updateLegacyRig;
  idlePivot.remove(fallback);idlePivot.add(normalized);usingFallback=false;ready('Original T-Rex model loaded! Tap Start AR to place it.');
 },undefined,error=>{console.warn('Legacy OBJ failed; using built-in dinosaur',error);ready('Dinosaur ready (lightweight model). Tap Start AR to place it.');});
},undefined,error=>{console.warn('Legacy materials failed; using built-in dinosaur',error);ready('Dinosaur ready (lightweight model). Tap Start AR to place it.');});

document.getElementById('size').onclick=()=>{mini=!mini;applySize()};
document.getElementById('rotate').onclick=()=>{dinosaur.rotation.y+=Math.PI/4};
document.getElementById('reset').onclick=()=>{dinosaur.rotation.set(0,0,0);dinosaur.position.set(0,0,0);placed=false;document.body.classList.remove('ar-placed');placeButton.textContent='🦖 Place T-Rex';if(renderer.xr.isPresenting)dinosaur.visible=false;else{camera.position.set(7,4.3,10);controls.target.set(0,1.8,0);controls.update()}};
const reticle=new THREE.Mesh(new THREE.RingGeometry(.13,.18,40),new THREE.MeshBasicMaterial({color:0xb8e0ab,side:THREE.DoubleSide}));reticle.rotation.x=-Math.PI/2;reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
let hitTestSource=null,referenceSpace=null;const placeButton=document.getElementById('place');const tip=document.getElementById('reticle-tip');
const arButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.getElementById('ui')}});
document.getElementById('ar-slot').appendChild(arButton);
arButton.textContent=arButton.textContent==='START AR'?'Start AR':arButton.textContent;
renderer.xr.addEventListener('sessionstart',async()=>{

 try{const session=renderer.xr.getSession();referenceSpace=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:referenceSpace});}catch(e){tip.textContent='Surface tracking unavailable. You can still place the T-Rex in front of you.'}

function placeDinosaur(){

 if(reticle.visible){dinosaur.position.setFromMatrixPosition(reticle.matrix)}

}

  idlePivot.rotation.y=Math.sin(t*.62)*.045+Math.sin(t*.17)*.035;

</script>
