const hitMatrix=new THREE.Matrix4();const placeButton=document.getElementById('place');const tip=document.getElementById('reticle-tip');
const arButton=ARButton.createButton(renderer,{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.getElementById('ui')}});
document.getElementById('ar-slot').appendChild(arButton);
arButton.textContent=arButton.textContent==='START AR'?'Start AR':arButton.textContent;
renderer.xr.addEventListener('sessionstart',async()=>{
 document.body.classList.add('ar-active');document.body.classList.remove('ar-placed');tip.textContent='Scan the ground, then press Place T-Rex';placeButton.textContent='🦖 Place T-Rex';scene.background=null;ground.visible=false;grid.visible=false;controls.enabled=false;applySize();placed=false;resetStart=-1;portalOpeningStart=-1;restoreDinoOpacity();surfaceFound=false;lastSurfaceHit=-Infinity;scanStart=performance.now();reticle.visible=false;arrivalStart=-1;arrivalPortal.visible=false;arrivalPortal.scale.setScalar(1);placeButton.disabled=false;placeButton.style.display='';dinosaur.visible=false;
 try{
  const session=renderer.xr.getSession();
  referenceSpace=await session.requestReferenceSpace('viewer');
  // Aim a second ray down toward the floor as well as the screen centre.
  // This often finds a floor sooner without using guessed placement.
  const requests=[session.requestHitTestSource({space:referenceSpace})];
  if(typeof XRRay!=='undefined'){
   const floorRay=new XRRay({x:0,y:0,z:0},{x:0,y:-.48,z:-1});
   requests.push(session.requestHitTestSource({space:referenceSpace,offsetRay:floorRay}).catch(()=>null));
  }
  const sources=await Promise.all(requests);
  if(renderer.xr.getSession()!==session){sources.forEach(source=>source?.cancel());return}
  hitTestSource=sources[0];floorHitTestSource=sources[1]||null;
 }catch(e){tip.textContent='Surface tracking unavailable on this device or session.'}
});
renderer.xr.addEventListener('sessionend',()=>{document.body.classList.remove('ar-active','ar-placed');scene.background=rainTexture;ground.visible=true;grid.visible=true;controls.enabled=true;applySize();dinosaur.visible=true;dinosaur.position.set(0,0,0);reticle.visible=false;arrivalPortal.visible=false;arrivalStart=-1;arrivalScale.scale.setScalar(1);placeButton.disabled=false;placeButton.style.display='';hitTestSource?.cancel();floorHitTestSource?.cancel();hitTestSource=null;floorHitTestSource=null;referenceSpace=null;surfaceFound=false;lastSurfaceHit=-Infinity;placed=false;resetStart=-1;portalOpeningStart=-1;restoreDinoOpacity();reticle.scale.setScalar(1)});
function placeDinosaur(){
 if(!renderer.xr.isPresenting||!loaded){tip.textContent='The dinosaur is still loading. Please wait.';return}
 if(placed||resetStart>=0||portalOpeningStart>=0||(!surfaceFound&&performance.now()-scanStart<fastScanMs))return;
 if(surfaceFound&&reticle.visible){dinosaur.position.copy(reticle.position)}
 else{
  // Use the same floor-level estimate shown by the portal. Do not
  // recalculate a camera-forward point that can land at desk height.
  dinosaur.position.copy(reticle.position);
 }
 dinosaur.rotation.y=INITIAL_DINO_YAW;rotationFrom=INITIAL_DINO_YAW;rotationTo=INITIAL_DINO_YAW;rotationStart=-1;dinosaur.visible=true;placed=true;arrivalStart=performance.now();portalCloseStart=arrivalStart+arrivalDuration;arrivalPortal.userData.sparks.visible=true;arrivalScale.scale.setScalar(.015);arrivalPortal.position.copy(dinosaur.position);arrivalPortal.visible=true;arrivalPortal.scale.setScalar(mini?1:2.2);document.body.classList.add('ar-placed');placeButton.disabled=true;placeButton.style.display='none';tip.textContent='';
}
placeButton.addEventListener('click',placeDinosaur);
renderer.domElement.addEventListener('click',()=>{if(renderer.xr.isPresenting)placeDinosaur()});
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
renderer.setAnimationLoop((time,frame)=>{
 const t=time*.001;
 if(loaded&&!reducedMotion.matches){
  if(!usingFallback&&legacyRigUpdate)legacyRigUpdate(t);
  // Keep the dinosaur completely still: no body sway, rocking or scaling.
  idlePivot.rotation.set(0,0,0);
  idlePivot.scale.set(1,1,1);
 }else{idlePivot.rotation.set(0,0,0);idlePivot.scale.set(1,1,1)}
 // Prefer genuine WebXR hit-test positions, keeping the last good hit
 // briefly when ARCore loses a frame. Use the actual hit position rather
 // than rejecting valid hits based on inconsistent device pose orientation.
 if(renderer.xr.isPresenting&&!placed){
  const now=performance.now();
  let validHit=false;
  if(frame&&(hitTestSource||floorHitTestSource)){
   // Prefer the centre ray when it hits, then try the downward floor ray.
   const sources=[hitTestSource,floorHitTestSource];
   for(const source of sources){
    if(!source)continue;
    const hits=frame.getHitTestResults(source);
    for(const hit of hits){
     const pose=hit.getPose(renderer.xr.getReferenceSpace());
     if(!pose)continue;
     hitMatrix.fromArray(pose.transform.matrix);
     candidateSurface.setFromMatrixPosition(hitMatrix);
     if(!Number.isFinite(candidateSurface.x+candidateSurface.y+candidateSurface.z))continue;
     // WebXR returns genuine tracked surfaces; avoid height-based rejection
     // that could discard a valid floor on devices with different origins.
     surfaceTarget.copy(candidateSurface);
     validHit=true;lastSurfaceHit=now;surfaceFound=true;
     if(!reticle.visible||reticle.position.distanceTo(surfaceTarget)>1.2)
      reticle.position.copy(surfaceTarget);
     else reticle.position.lerp(surfaceTarget,.24);
     reticle.quaternion.identity();reticle.visible=true;
     break;
    }
    if(validHit)break;
   }
  }
  if(!validHit&&now-lastSurfaceHit<trackingGraceMs){
   surfaceFound=true;reticle.visible=true;
  }else if(!validHit){
   surfaceFound=false;
   if(now-scanStart>=fastScanMs){
    // Fast mode: clearly identified estimate, never presented as a tracked hit.
    // Ray toward the visible floor, then clamp to an estimated floor height.
    const xrCamera=renderer.xr.getCamera();
    const direction=new THREE.Vector3(0,0,-1).applyQuaternion(xrCamera.quaternion);
    const floorY=xrCamera.position.y-1.35;
    const distance=direction.y<-.08
     ?THREE.MathUtils.clamp((floorY-xrCamera.position.y)/direction.y,.6,4)
     :2;
    reticle.position.copy(xrCamera.position).addScaledVector(direction,distance);
    reticle.position.y=floorY;
    reticle.quaternion.identity();reticle.visible=true;
   }else reticle.visible=false;
  }
  const fastReady=now-scanStart>=fastScanMs;
  placeButton.disabled=resetStart>=0||portalOpeningStart>=0||(!surfaceFound&&!fastReady);
  placeButton.textContent=surfaceFound?'🦖 Place T-Rex':fastReady?'Place (Estimated)':'Scanning…';
  tip.textContent=surfaceFound?'Surface found — tap Place T-Rex':
   fastReady?'Fast mode: estimated floor position; reset if needed.':
   'Quick scan for a real surface…';
 }
 if(placed||resetStart>=0)reticle.visible=false;
 function animatePortalParticles(portal,clock){const d=portal.userData;for(let i=0;i<d.count;i++){const phase=i*2.399963+clock*.75;const radius=.12+(i%9)/9*.22;const j=i*3;d.positions[j]=Math.cos(phase)*radius;d.positions[j+1]=.04+((clock*.12+i*.073)% .35);d.positions[j+2]=Math.sin(phase)*radius;}d.sparks.geometry.attributes.position.needsUpdate=true}
 if(reticle.visible){animatePortalParticles(reticle,t);reticle.userData.ticks.rotation.y=t*.35;reticle.userData.energy.material.opacity=.12+Math.sin(t*3)*.06}
 if(arrivalPortal.visible){animatePortalParticles(arrivalPortal,t);arrivalPortal.userData.ticks.rotation.y=-t*.9;arrivalPortal.userData.energy.material.opacity=.13+Math.sin(t*4)*.07}
 if(arrivalStart>=0){
  const progress=Math.min(1,(performance.now()-arrivalStart)/arrivalDuration);
  const eased=1-Math.pow(1-progress,3);
  arrivalScale.scale.setScalar(.015+.985*eased);
  if(progress>=1){arrivalStart=-2;arrivalScale.scale.setScalar(1);arrivalPortal.userData.sparks.visible=false}
 }
 // Once the T-Rex has fully arrived, collapse the portal independently
 // of the Rotate button. The dinosaur remains at full size.
 if(arrivalStart===-2){
  const elapsed=Math.max(0,performance.now()-portalCloseStart);
  const progress=Math.min(1,elapsed/650);
  const eased=progress*progress*(3-2*progress);
  const startingScale=mini?1:2.2;
  arrivalPortal.scale.setScalar(Math.max(.001,startingScale*(1-eased)));
  if(progress>=1){
   arrivalPortal.visible=false;
   arrivalPortal.userData.sparks.visible=false;
   arrivalStart=-1;
  }
 }
 if(resetStart>=0){
  const u=Math.min(1,(performance.now()-resetStart)/dissolveDuration);
  const eased=u*u*(3-2*u);
  setDinoOpacity(1-eased);
  if(u>=1){resetStart=-1;finishReset()}
 }
 if(portalOpeningStart>=0){
  const u=Math.min(1,(performance.now()-portalOpeningStart)/portalOpeningDuration);
  const eased=u*u*(3-2*u);
  reticle.scale.setScalar(Math.max(.001,eased));
  if(u>=1){
   portalOpeningStart=-1;reticle.scale.setScalar(1);
   placeButton.disabled=false;placeButton.style.display='';
   placeButton.textContent='🦖 Place T-Rex';
  }
 }
 if(sizeStart>=0){
  const u=Math.min(1,(performance.now()-sizeStart)/sizeDuration);
  const eased=u*u*(3-2*u);
  dinosaur.scale.setScalar(sizeFrom+(sizeTo-sizeFrom)*eased);
  if(u>=1){sizeStart=-1;dinosaur.scale.setScalar(sizeTo)}
 }
 if(rotationStart>=0){
  const u=Math.min(1,(performance.now()-rotationStart)/rotationDuration);
  const e=u*u*(3-2*u);
  dinosaur.rotation.y=rotationFrom+(rotationTo-rotationFrom)*e;
  if(u>=1){rotationStart=-1;rotationFrom=rotationTo}
 }
 if(!renderer.xr.isPresenting){animateDigitalRain(performance.now());controls.update();}
 renderer.render(scene,camera);
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
