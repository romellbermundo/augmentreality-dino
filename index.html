<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hello, World! - A-Frame</title>
    <meta name="description" content="Hello, World! - A-Frame">
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>

        <a-asset-items id="Flutter-obj" src="assets/psone/Flutter.obj" />
        <a-asset-items id="Flutter-mtl" src="assets/psone/Flutter.mtl" />
        <a-asset-items id="t-rexaur-obj" src="assets/psone/t-rexaur.obj" />
        <a-asset-items id="t-rexaur-mtl" src="assets/psone/t-rexaur.mtl" />
        <a-asset-items id="Naruto-obj" src="assets/pstwo/Naruto.obj" />
        <a-asset-items id="Naruto-mtl" src="assets/pstwo/Naruto.mtl" />
        <a-asset-items id="Tibbers Hextech-obj" src="assets/games/Tibbers Hextech.obj" />
        <a-asset-items id="Tibbers Hextech-mtl" src="assets/games/Tibbers Hextech.mtl" />


      </a-assets>
      <a-light
      type="ambient"
      position="0 0 0"
      rotation="0 0 0"
      target="#directionaltarget"
      intensity="1"
      >
      <a-light
      type="point"
      position="10 0 -50"
      >

    </a-light>
      <a-entity obj-model="obj: #Flutter-obj; mtl: #Flutter-mtl"  scale=".01 .01 .01" position="0 10 -15" rotation="0 90 0"></a-entity>
      <a-entity obj-model="obj: #Naruto-obj; mtl: #Naruto-mtl"   position="0 0 0" rotation="0 0 0"></a-entity>
      <a-entity obj-model="obj: #t-rexaur-obj; mtl: #t-rexaur-mtl"  scale=".001 .001 .001" position="0 0 -50" rotation="180 0 0"></a-entity>
      <a-entity obj-model="obj: #Tibbers Hextech-obj; mtl: #Tibbers Hextech-mtl"   scale=".1 .1 .1"  position="15 0 -50" rotation="0 0 0"></a-entity>

      <!-- workspace lights -->

      <a-box position="9 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="10 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="11 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane position="10 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky src="#skyTexture" rotation="0 270 0"></a-sky>
      
            <!-- picnic blanket -->
      <a-plane
        position="0 .1 -4"
        rotation="-90 0 0"
        width="4"
        height="4"
        color="#7BC8A4"
        event-set__down="_event: mousedown; material.wireframe: true"
        event-set__up="_event: mouseup; material.wireframe: false"
        event-set__leave="_event: mouseleave; material.wireframe: false"
      ></a-plane>
      <!-- <a-entity gltf-model="#spaceship" position="0 0 0"> </a-entity> -->
      <a-entity gltf-model="#rflogo" position="0 0 5"> </a-entity>
      <!-- <a-entity gltf-model="assets/rflogo/rflogo.glb" position="0 0 -10"> </a-entity> -->
      <a-entity gltf-model="assets/game-assets/WonderWalls_SecondAge.gltf" scale="3 3 3" position="10 0 -10"> </a-entity>
    </a-scene>
    <script>
      // Get the camera element
      const camera = document.querySelector('#camera');

      // Define the jump function
      function jump() {
        // Set the camera's y-position to a higher value
        camera.setAttribute('position', `${camera.getAttribute('position').x} ${camera.getAttribute('position').y + 1} ${camera.getAttribute('position').z}`);
      }

      // Listen for the space keypress
      window.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
          jump();
        }
      });
    </script>
  </body>
</html>
