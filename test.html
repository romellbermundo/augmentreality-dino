<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hello World Splash Screen</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent("splash", {
        init: function () {
          document.addEventListener("keydown", (event) => {
            if (event.code === "Enter") {
              this.el.style.display = "none";
            }
          });
          this.el.addEventListener("click", () => {
            this.el.style.display = "none";
          });
        },
      });
    </script>
    <style>
      #splash-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: #fff;
        font-size: 3em;
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen" class="splash">
      <p>Hello World</p>
      <p>Press "Enter" to continue</p>
    </div>
    <a-scene>
      <!-- your scene content here -->
      <a-torus
        id="rosca"
        rotation="0 0 0"
        position="-10 10 -20"
        color="#43A367"
        arc="360"
        radius="3"
        radius-tubular="0.2"
      ></a-torus>
    </a-scene>
  </body>
</html>
