<html>
  <head>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.0/howler.core.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.1/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere
        id="red-sphere"
        radius="1"
        position="0 1.6 -2"
        color="#F00"
        cursor-listener
      ></a-sphere>
      <a-camera>
        <a-cursor id="cursor" color="#F00" opacity="0"></a-cursor>
      </a-camera>
      <a-entity environment="preset: forest"></a-entity>
    </a-scene>
    <script>
      const redSphere = document.getElementById("red-sphere");
      const audioStreamUrl = "https://supersoul.live:8000/OSS128kbps";
      let audioPlayer;
      let audioPlaying = false;

      redSphere.addEventListener("click", () => {
        if (audioPlaying) {
          audioPlayer.stop();
          audioPlaying = false;
        } else {
          audioPlayer = new Howl({
            src: [audioStreamUrl],
            html5: true,
            format: ["mp3", "aac"],
            volume: 1,
          });
          audioPlayer.play();
          audioPlaying = true;
        }
      });
    </script>
  </body>
</html>
