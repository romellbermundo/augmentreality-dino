<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-plane
        position="0 0 -4"
        rotation="-90 0 0"
        width="8"
        height="8"
        color="#649681"
      ></a-plane>

      <!-- Sky & Ground -->

      <a-triangle
        position="-1 0.5 -3"
        color="#f97b2f"
        material="side: double"
      ></a-triangle>

      <a-triangle
        position="-1 0.5 -2"
        color="#f97b2f"
        material="side: double"
      ></a-triangle>

      <a-plane
        position="-1 .5 -2.5"
        rotation="0 90"
        width="1"
        height="1"
        color="#f97b2f"
        material="side: double"
      ></a-plane>

      <a-plane
        position="-1.25 .5 -2.5"
        rotation="-30 -90"
        width="1"
        height="1"
        color="#f97b2f"
        material="side: double"
      ></a-plane>

      <a-plane
        position="-.75 .5 -2.5"
        rotation="-30 90"
        width="1"
        height="1"
        color="#f97b2f"
        material="side: double"
      ></a-plane>

      <!-- Tent 1 (orange) -->

      <a-triangle
        position="-1 0.5 -6.5"
        color="#596fff "
        material="side: double"
      ></a-triangle>

      <a-triangle
        position="-1 0.5 -5.5"
        color="#596fff "
        material="side: double"
      ></a-triangle>

      <a-plane
        position="-1 .5 -6"
        rotation="0 90"
        width="1"
        height="1"
        color="#596fff "
        material="side: double"
      ></a-plane>

      <a-plane
        position="-1.25 .5 -6"
        rotation="-30 -90"
        width="1"
        height="1"
        color="#596fff "
        material="side: double"
      ></a-plane>

      <a-plane
        position="-.75 .5 -6"
        rotation="-30 90"
        width="1"
        height="1"
        color="#596fff "
        material="side: double"
      ></a-plane>

      <!-- Tent 2 (Blue) -->

      <a-triangle
        position=".75 0.5 -3.75"
        color="#274e13 "
        material="side: double"
      ></a-triangle>

      <a-triangle
        position=".75 .5 -4.75"
        color="#274e13 "
        material="side: double"
      ></a-triangle>

      <a-plane
        position=".75 .5 -4.25"
        rotation="0 90"
        width="1"
        height="1"
        color="#274e13 "
        material="side: double"
      ></a-plane>

      <a-plane
        position=".50 .5 -4.25"
        rotation="-30 -90"
        width="1"
        height="1"
        color="#274e13 "
        material="side: double"
      ></a-plane>

      <a-plane
        position="1 .5 -4.25"
        rotation="-30 90"
        width="1"
        height="1"
        color="#274e13 "
        material="side: double"
      ></a-plane>

      <!-- Tent 2 (green) -->

      <a-cylinder
        position="3 0.75 -3"
        radius="0.10"
        height="2"
        color="#4d3225"
      ></a-cylinder>

      <a-sphere position="3 1.50 -3" radius=".75" color="#53982f"></a-sphere>

      <!-- tree 1 -->

      <a-cylinder
        position="-3 0.75 -2"
        radius="0.10"
        height="2"
        color="#4d3225"
      ></a-cylinder>

      <a-sphere position="-3 1.50 -2" radius=".75" color="#53982f"></a-sphere>

      <!-- tree 2 -->

      <a-cylinder
        position="-2.5 1 -.5"
        radius="0.10"
        height="2"
        color="#4d3225"
      ></a-cylinder>

      <a-sphere
        position="-2.5 1.50 -.5"
        radius=".75"
        color="#53982f"
      ></a-sphere>

      <!-- tree 3 -->

      <a-cylinder
        position="-.50 1 -1"
        radius="0.10"
        height="2"
        color="#4d3225"
      ></a-cylinder>

      <a-sphere position="-.50 1.50 -1" radius=".75" color="#53982f"></a-sphere>

      <!-- Campfire -->

      <a-cylinder
        position="-2 0 -4"
        rotation="90"
        radius="0.10"
        height=".5"
        color="#554738"
      ></a-cylinder>

      <a-cylinder
        position="-2 0 -4"
        rotation="90 90"
        radius="0.10"
        height=".5"
        color="#554738"
      ></a-cylinder>

      <a-cylinder
        position="-2 0 -4"
        rotation="90 45"
        radius="0.05"
        height=".5"
        color="#554738"
      ></a-cylinder>

      <a-cylinder
        position="-2 0 -4"
        rotation="90 -45"
        radius="0.05"
        height=".5"
        color="#554738"
      ></a-cylinder>

      <a-triangle
        position="-2 -0 -4"
        color="#cc0000 "
        material="side: double"
      ></a-triangle>

      <a-triangle
        position="-2 -0 -4"
        rotation="0 45 0"
        color="#ffcb33 "
        material="side: double"
      ></a-triangle>

      <a-triangle
        position="-2 -0 -4"
        rotation="0 -45 0"
        color="#ffae5a "
        material="side: double"
      ></a-triangle>

      <!-- Pond -->

      <a-cylinder
        position="2 0 -1"
        rotation="0"
        radius=".75"
        height=".01"
        color="#0b5394"
      ></a-cylinder>

      <a-cylinder
        position="3 0 -1"
        rotation="0"
        radius=".50"
        height=".01"
        color="#0b5394"
      ></a-cylinder>

      <a-cylinder
        position="2.7 0 -1.5"
        rotation="0"
        radius=".50"
        height=".01"
        color="#0b5394"
      ></a-cylinder>

      <a-cylinder
        position="2.7 0 -0.45"
        rotation="0"
        radius=".35"
        height=".01"
        color="#0b5394"
      ></a-cylinder>

      <!-- Mountain -->

      <a-triangle
        position="2.5 0.5 -6.25"
        color="#bbbbbb "
        material="side: double"
      ></a-triangle>

      <a-triangle
        position="2.5 0.5 -6.25"
        color="#bbbbbb "
        material="side: double"
        rotation="0 45 0"
      ></a-triangle>
    </a-scene>
  </body>
</html>
