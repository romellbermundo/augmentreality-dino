<!DOCTYPE html>
<html>
  <head>
    <title>Cadena de manufactura 3D</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>
      <a-assets>
        <a-asset-item
          id="banda"
          src="https://cdn.glitch.global/418a2804-675f-4719-a3ff-ffc1e1b1a185/Banda%20transpotadora.glb?v=1679976825044"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="brazo"
          src="https://cdn.glitch.global/418a2804-675f-4719-a3ff-ffc1e1b1a185/ROBOTIC%20ARMsin%20base.glb?v=1679976855659"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="base"
          src="https://cdn.glitch.global/418a2804-675f-4719-a3ff-ffc1e1b1a185/FOOTING%20ROBOTIC%20ARM.glb?v=1679976837836"
        ></a-asset-item>
      </a-assets>

      <a-assets>
        <a-asset-item
          id="mesa"
          src="https://cdn.glitch.global/418a2804-675f-4719-a3ff-ffc1e1b1a185/Table.glb?v=1679976865879"
        ></a-asset-item>
      </a-assets>

      <a-entity
        gltf-model="#banda"
        modify-materials
        position="0 0 0"
        scale="2.5 2.5 2.5"
      >
      </a-entity>

      <a-entity
        gltf-model="#mesa"
        modify-materials
        position="-0.2  -0.75 1"
        scale="0.5 0.5 0.5"
        rotation="0 90 0"
      >
      </a-entity>

      <a-entity
        gltf-model="#base"
        modify-materials
        position="0.3 0.099 0.8"
        scale="0.3 0.3 0.3"
        rotation="90 0 0"
      >
      </a-entity>

      <a-entity
        gltf-model="#brazo"
        modify-materials
        position="0.3 0.099 0.8"
        scale="0.3 0.3 0.3"
        rotation="0 90 0"
        animation="property: rotation; to: 0 270 0; loop: true; dur: 7000"
      >
      </a-entity>

      <a-entity position="1 -1 3" rotation="-10 40 0">
        <a-camera></a-camera>
      </a-entity>
      <a-sky
        material="color: white; shader: flat; src:https://cdn.glitch.global/1263b2df-cdb7-4573-838c-ee1fc491939a/thumbnail_3be66996-e8ec-419c-b46a-d468d0fe2c47.jpg.2048x2048_q85.jpg?v=1680207527013"
      ></a-sky
      >"
    </a-scene>
  </body>
</html>
