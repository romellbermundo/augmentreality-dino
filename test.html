<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-box id="myBox" position="0 1 -5" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-camera position="0 1.6 0">
      <a-cursor></a-cursor>
    </a-camera>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const box = document.querySelector("#myBox");
      box.addEventListener("click", function() {
        const randomX = Math.floor(Math.random() * 6) - 3;
        const randomY = Math.floor(Math.random() * 6) - 3;
        const randomZ = Math.floor(Math.random() * 6) - 8;
        box.setAttribute("position", {x: randomX, y: randomY, z: randomZ});
      });
    });
  </script>
</body>
</html>
